name: 'Daleel'
description: 'Scan for Saudi DGA design-system readiness (RTL-first, IBM Plex Sans Arabic, WCAG 2.2 AA)'
author: 'Othmane Morad'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  path:
    description: 'File or directory to scan'
    default: '.'
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: node "${{ github.action_path }}/bin/daleel.js" "${{ inputs.path }}"
